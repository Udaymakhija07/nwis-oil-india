version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nwis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nwis_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nwis_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-nwis_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nwis_admin} -d ${DB_NAME:-nwis_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nwis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: nwis-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-oil_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-oil_minio_pass_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nwis-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: postgres://${DB_USER:-nwis_admin}:${DB_PASSWORD:-nwis_secure_pass_2026}@postgres:5432/${DB_NAME:-nwis_db}
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_sih2026_oil_india}
    ports:
      - "5000:5000"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: nwis-ai-service
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: postgres://${DB_USER:-nwis_admin}:${DB_PASSWORD:-nwis_secure_pass_2026}@postgres:5432/${DB_NAME:-nwis_db}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nwis-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
